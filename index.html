<style>
  /* Layout: brand bar + level meter on top, sticky tab strip, one reading column (max 860px); book page in LTR serif, chrome in RTL; audio player docked to the bottom while reading */
  :root{
    /* calm, warm palette: cream paper, soft slate ink, sage accent */
    --bg:#FAF9F6; --surface:#FFFEFB; --sunk:#F1EEE7; --ink:#2D3748; --muted:#667085; --line:#E6E1D6;
    --primary:#2F7D73; --primary-ink:#FFFEFB; --primary-soft:#DFEDE9;
    --sun:#E3B341; --sun-soft:#FAF0D2; --coral:#CF735C;
    --new-bg:#DCEBFA; --learn-bg:#FBE9A6; --karaoke:#F3B36B; --karaoke-ink:#3A2608;
    --new:#2F6FB3; --learn:#B7791F; --known:#2F8A57; --known-bg:#DDF1E4; --go:#2F8A57; --go-ink:#FFFFFF;
    --shadow-md:0 4px 10px rgba(45,55,72,.07),0 14px 32px rgba(45,55,72,.10);
    --good:#3F8F60; --good-soft:#E2F0E6; --bad:#BF5B58; --bad-soft:#F7E3E0;
    --shadow:0 1px 2px rgba(45,55,72,.04),0 4px 14px rgba(45,55,72,.05);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0D191C; --surface:#14262A; --sunk:#1B3136; --ink:#E5F0EE; --muted:#93ABAE; --line:#263F3E;
    --primary:#2CB9A8; --primary-ink:#04211D; --primary-soft:#173B37;
    --sun:#FFCA55; --sun-soft:#40340F; --coral:#FF8468;
    --new-bg:#17364D; --learn-bg:#4B3F10; --karaoke:#FF8A00; --karaoke-ink:#1A0E00; --new:#7FB6F0; --learn:#F2C35B; --known:#5FD394; --known-bg:#173A28; --go:#3CCB78; --go-ink:#06231A; --shadow-md:0 4px 12px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.3);
    --good:#3CCB78; --good-soft:#133826; --bad:#FF6B70; --bad-soft:#40191C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22); color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0D191C; --surface:#14262A; --sunk:#1B3136; --ink:#E5F0EE; --muted:#93ABAE; --line:#263F3E;
    --primary:#2CB9A8; --primary-ink:#04211D; --primary-soft:#173B37;
    --sun:#FFCA55; --sun-soft:#40340F; --coral:#FF8468;
    --new-bg:#17364D; --learn-bg:#4B3F10; --karaoke:#FF8A00; --karaoke-ink:#1A0E00; --new:#7FB6F0; --learn:#F2C35B; --known:#5FD394; --known-bg:#173A28; --go:#3CCB78; --go-ink:#06231A; --shadow-md:0 4px 12px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.3);
    --good:#3CCB78; --good-soft:#133826; --bad:#FF6B70; --bad-soft:#40191C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22); color-scheme:dark; }
  html,body{ background:var(--bg); color:var(--ink); }
  body{ font-family:Heebo,system-ui,sans-serif; font-size:16px; }
  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--surface); }
  .gutter{ padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
  h1,h2,h3{ text-wrap:balance; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  /* tactile press: every active button eases for 150ms and dips to 95% while held */
  button, [role="button"], .btn{ transition:transform .15s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, filter .15s ease, color .15s ease, opacity .15s ease; }
  button:not(:disabled):not([aria-disabled="true"]):active{ transform:scale(.95); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:12px; font-weight:600; cursor:pointer; user-select:none; }
  button.card-btn:not(:disabled):active{ transform:scale(.985); }
  .card-lift:hover{ transform:translateY(-2px); border-color:var(--primary); }
  button.word:not(:disabled):active, .word[role="button"]:active{ transform:none; }
  /* touch: 44px minimum targets; small glyph buttons get an invisible larger hit area */
  .btn{ min-height:44px; }
  .seg button{ min-height:40px; }
  .hit{ position:relative; }
  .hit::after{ content:""; position:absolute; inset:-8px; min-width:44px; min-height:44px; left:50%; top:50%; transform:translate(-50%,-50%); }
  .chip{ display:inline-flex; align-items:center; min-height:44px; padding:.2em .85em; border-radius:10px; }
  .word{ position:relative; }
  .word.chip{ padding:.2em .85em; min-width:44px; justify-content:center; margin:0; }
  @media (pointer:coarse){ .reading .word::after{ content:""; position:absolute; inset:-.42em -.1em; } .reading{ line-height:2.2; word-spacing:.12em; } .reading .word{ padding:.1em .22em; } .seg button{ min-height:44px; } }
  .fab{ position:fixed; left:max(16px,env(safe-area-inset-left,0px)); z-index:36; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; box-shadow:0 6px 18px rgba(20,40,46,.25); }
  @media (min-width:640px){ .fab{ display:none; } }
  @media (max-width:639px){ .dock-mobile{ position:fixed; z-index:36; left:max(16px,env(safe-area-inset-left,0px)); right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); min-height:54px; font-size:1.1rem; box-shadow:0 6px 18px rgba(20,40,46,.25); } }
  bdi{ unicode-bidi:isolate; }
  .bar{ transition:width .5s ease-out, height .5s ease-out; }
  .swatch{ border-radius:5px; padding:.04em .4em; }
  .overlay{ animation:fade .18s ease-out; }
  .overlay.out{ animation:fadeout .17s ease-in forwards; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  @keyframes fadeout{ from{ opacity:1 } to{ opacity:0 } }
  .sheet.out{ animation:sheetout .17s ease-in forwards; }
  @keyframes sheetout{ to{ transform:translateY(16px); opacity:0 } }
  .dropdown{ opacity:0; transform:translateY(-4px); pointer-events:none; visibility:hidden; transition:opacity .15s ease, transform .15s ease, visibility 0s linear .15s; }
  .dropdown.show{ opacity:1; transform:none; pointer-events:auto; visibility:visible; transition:opacity .15s ease, transform .15s ease; }
  .toast{ top:calc(124px + env(safe-area-inset-top,0px)); }
  @media (max-width:639px){ .toast{ top:auto; bottom:calc(104px + env(safe-area-inset-bottom,0px)); } }
  .toast{ left:50%; transform:translateX(-50%); animation:toastin .22s ease-out; transition:opacity .22s ease, transform .22s ease; }
  .toast.out{ opacity:0; transform:translate(-50%,-8px); }
  @keyframes toastin{ from{ opacity:0; transform:translate(-50%,-10px) } to{ opacity:1; transform:translateX(-50%) } }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--sunk); color:var(--ink); }
  .btn-ghost:hover{ background:var(--primary-soft); }
  .btn-line{ border:1.5px solid var(--line); color:var(--ink); background:var(--surface); }
  .btn-line:hover{ border-color:var(--primary); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  :focus-visible{ outline:3px solid var(--sun); outline-offset:2px; border-radius:8px; }
  .seg{ display:inline-flex; background:var(--sunk); border-radius:12px; padding:3px; gap:3px; }
  .seg button{ white-space:nowrap; padding:.38rem .7rem; border-radius:9px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; font-size:.9rem; }
  .seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .tag{ display:inline-flex; align-items:center; gap:.25rem; font-size:.72rem; font-weight:600; padding:.12rem .5rem; border-radius:6px; background:var(--sunk); color:var(--muted); white-space:nowrap; }
  .tag-level{ background:var(--primary-soft); color:var(--primary); }
  .tag-real{ background:var(--sun-soft); color:var(--ink); }
  .field{ width:100%; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; padding:.65rem .8rem; }
  .field:focus{ outline:none; border-color:var(--primary); }
  .book{ font-family:Literata,Georgia,'Times New Roman',serif; letter-spacing:.01em; }
  .reading{ font-family:Literata,Georgia,'Times New Roman',serif; font-size:var(--read-size,1.3rem); line-height:2; letter-spacing:.012em; }
  .reading.pron{ line-height:2.5; }
  .word{ border-radius:5px; padding:.04em .12em; margin:0 -.03em; cursor:pointer; transition:background-color .2s, color .2s, box-shadow .2s; }
  .word:hover{ box-shadow:0 0 0 1.5px var(--primary); }
  .w-new{ background:var(--new-bg); }
  .w-learn{ background:var(--learn-bg); }
  .w-active{ background:var(--karaoke)!important; color:var(--karaoke-ink)!important; box-shadow:0 2px 10px color-mix(in srgb,var(--karaoke) 55%,transparent); }
  .wstack{ display:inline-flex; flex-direction:column; align-items:center; line-height:1.15; vertical-align:baseline; }
  .pron-hint{ font-family:Heebo,sans-serif; font-size:.5em; color:var(--muted); font-weight:500; margin-top:.12em; line-height:1; }
  .w-active .pron-hint{ color:inherit; }
  .para-he{ font-family:Heebo,sans-serif; color:var(--muted); font-size:1rem; line-height:1.8; }
  .toggle{ width:44px; height:26px; border-radius:99px; background:var(--line); position:relative; transition:background .2s; flex:none; }
  .toggle::after{ content:""; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:right .2s; }
  .toggle::before{ content:""; position:absolute; inset:-9px 0; }
  .toggle[aria-checked="true"]{ background:var(--primary); }
  .toggle[aria-checked="true"]::after{ right:21px; }
  .pop{ animation:pop .35s ease-out; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.07)} 100%{transform:scale(1)} }
  .shake{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .rise{ animation:rise .3s ease-out; }
  @keyframes rise{ from{ transform:translateY(10px); opacity:.4 } to{ transform:none; opacity:1 } }
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; }
  .confetti i{ position:absolute; top:-12px; width:10px; height:14px; border-radius:3px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translate3d(var(--dx),110vh,0) rotate(var(--rot)); } }
  .combo-badge{ animation:combo .3s ease-out; }
  @keyframes combo{ 0%{transform:scale(.85); opacity:.3} 100%{transform:none; opacity:1} }
  .sheet{ animation:sheet .22s ease-out; }
  @keyframes sheet{ from{ transform:translateY(24px); opacity:0 } to{ transform:none; opacity:1 } }
  .num{ font-variant-numeric:tabular-nums; }
  .opt{ border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:.85rem 1rem; font-weight:500; text-align:start; transition:border-color .15s, background .15s; }
  .opt:hover:not(:disabled){ border-color:var(--primary); }
  .opt.correct{ border-color:var(--good); background:var(--good-soft); }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .opt:disabled{ cursor:default; }
  #dict-search:focus-visible{ outline:none; }
  /* split view: story beside (desktop) or above (phone) the writing area */
  .split-view{ display:grid; gap:1rem; align-items:start; }
  .split-story{ max-height:46vh; overflow-y:auto; overscroll-behavior:contain; }
  @media (min-width:1024px){
    .split-view{ grid-template-columns:minmax(330px,1fr) minmax(0,1.2fr); }   /* page is RTL: first column is on the right */
    .split-story{ order:2; }                                                    /* story on the left, writing on the right */
    .split-story{ max-height:none; overflow:visible; }
    .practice-pane{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 128px); max-height:calc(100vh - 250px); overflow-y:auto; }
  }
  .practice-text{ font-size:1.15rem; line-height:1.9; resize:vertical; min-height:9rem; background:var(--bg); border-color:var(--line); }
  .dictation .reading{ filter:blur(7px); user-select:none; -webkit-user-select:none; pointer-events:none; }
  .pron-hint, .reading button{ user-select:none; -webkit-user-select:none; }
  .diff span{ border-radius:5px; padding:.08em .3em; margin:0 .12em .2em 0; display:inline-block; line-height:1.5; }

  { id:'dragon', level:2, title:'The Tiny Dragon', he:'הדרקונית הקטנטנה', cover:'🐉', blurb:'רובי לא יודעת לירוק אש. רק בועות.',

      { en:'In a green forest, there lives a tiny dragon. Her name is Ruby. Big dragons make fire, but Ruby can only make bubbles.', he:'ביער ירוק גרה דרקונית קטנטנה. קוראים לה רובי. דרקונים גדולים יורקים אש, אבל רובי יכולה לעשות רק בועות.' },
      { en:'The other dragons laugh at her. "Dragons need fire!" they say. Ruby feels sad. She sits alone near the river.', he:'הדרקונים האחרים צוחקים עליה. "דרקונים צריכים אש!" הם אומרים. רובי מרגישה עצובה. היא יושבת לבד ליד הנהר.' },
      { en:'One hot summer day, the forest starts to burn. The big dragons are afraid. Their fire cannot help.', he:'ביום קיץ חם אחד, היער מתחיל לבעור. הדרקונים הגדולים מפחדים. האש שלהם לא יכולה לעזור.' },
      { en:'Ruby flies over the trees. She makes a thousand bubbles full of water. The fire stops! Now everyone thinks Ruby is a hero.', he:'רובי עפה מעל העצים. היא עושה אלף בועות מלאות מים. האש נעצרת! עכשיו כולם חושבים שרובי היא גיבורה.' },
      { en:'That night, the dragons make a big party for her. "We are sorry, Ruby," they say. "You are small, but you are very brave." Ruby smiles and makes one more bubble.', he:'באותו לילה, הדרקונים עורכים לכבודה מסיבה גדולה. "אנחנו מצטערים, רובי," הם אומרים. "את קטנה, אבל את אמיצה מאוד." רובי מחייכת ועושה עוד בועה אחת.' }

  { id:'robot', level:2, title:"Grandma's New Robot", he:'הרובוט החדש של סבתא', cover:'🤖', blurb:'ביפ מנקה, מבשל ושר. קצת יותר מדי.',
    paras:[
      { en:'Grandma buys a new robot. It is tall and silver, and its name is Beep. Beep can clean, cook, and sing.', he:'סבתא קונה רובוט חדש. הוא גבוה וכסוף, וקוראים לו ביפ. ביפ יודע לנקות, לבשל ולשיר.' },
      { en:"On the first day, Beep cleans the house. But he cleans too much! He washes the cat, the plants, and Grandpa's hat.", he:'ביום הראשון, ביפ מנקה את הבית. אבל הוא מנקה יותר מדי! הוא שוטף את החתול, את הצמחים ואת הכובע של סבא.' },

      { en:'The next morning, Grandma finds Beep in the garden. He is giving water to the flowers, and to the car, and to the old dog next door. "Oh, Beep," she laughs. "Never change."', he:'למחרת בבוקר, סבתא מוצאת את ביפ בגינה. הוא משקה את הפרחים, וגם את המכונית, וגם את הכלב הזקן של השכנים. "אוי, ביפ," היא צוחקת. "אל תשתנה אף פעם."' }

  { id:'umbrella', level:2, title:'The Magic Umbrella', he:'המטרייה הקסומה', cover:'☂️', blurb:'נועה פותחת מטרייה ישנה, ומתרוממת לשמיים.',

  /* ---------- stage 3: true stories ---------- */
  { id:'hachiko', level:3, real:true, title:'The Dog Who Waited', he:'הכלב שחיכה', cover:'🐕', blurb:'סיפור אמיתי מיפן על נאמנות של כמעט עשר שנים.',
    paras:[
      { en:'This is a true story from Japan. In 1924, a professor named Ueno lived in Tokyo. He had a young dog with soft brown fur. The name of the dog was Hachiko.', he:'זהו סיפור אמיתי מיפן. בשנת 1924 גר בטוקיו פרופסור בשם אואנו. היה לו כלב צעיר עם פרווה חומה ורכה. שמו של הכלב היה האצ\'יקו.' },
      { en:'Every morning, Hachiko walked with the professor to Shibuya train station. The professor got on the train and went to work at the university. Every afternoon, at exactly the same time, Hachiko came back to the station. He sat near the door and waited. When the professor got off the train, the dog was always there, happy to see him.', he:'בכל בוקר האצ\'יקו הלך עם הפרופסור לתחנת הרכבת שיבויה. הפרופסור עלה לרכבת ונסע לעבודה באוניברסיטה. בכל אחר צהריים, בדיוק באותה שעה, האצ\'יקו חזר לתחנה. הוא ישב ליד הדלת וחיכה. כשהפרופסור ירד מהרכבת, הכלב תמיד היה שם, שמח לראות אותו.' },
      { en:'One day in May 1925, the professor did not come back. He became very sick at work and died. Hachiko did not understand. He waited at the station until night, but his friend never came.', he:'יום אחד במאי 1925, הפרופסור לא חזר. הוא חלה מאוד בעבודה ומת. האצ\'יקו לא הבין. הוא חיכה בתחנה עד הלילה, אבל החבר שלו לא הגיע.' },
      { en:'The next day, Hachiko returned. And the next day. And the day after that. He came to the station every afternoon for almost ten years. Rain, snow, or sun, he sat in the same place and watched the door.', he:'למחרת האצ\'יקו חזר. וגם ביום שאחריו. וגם ביום שאחרי. הוא הגיע לתחנה בכל אחר צהריים במשך כמעט עשר שנים. בגשם, בשלג או בשמש, הוא ישב באותו מקום והסתכל על הדלת.' },
      { en:'At first, people at the station did not like him. But slowly, they learned his story. They started to bring him food and water. A newspaper wrote about him, and soon everyone in Japan knew the name Hachiko. Children came to visit the loyal dog.', he:'בהתחלה, האנשים בתחנה לא אהבו אותו. אבל לאט לאט הם למדו את הסיפור שלו. הם התחילו להביא לו אוכל ומים. עיתון כתב עליו, ועד מהרה כולם ביפן הכירו את השם האצ\'יקו. ילדים באו לבקר את הכלב הנאמן.' },
      { en:'Hachiko died in 1935. Today, a statue of him stands outside Shibuya station. It is one of the most famous meeting places in Tokyo. When friends say, "See you at Hachiko," they remember a dog who never stopped waiting.', he:'האצ\'יקו מת בשנת 1935. היום עומד פסל שלו מחוץ לתחנת שיבויה. זהו אחד ממקומות המפגש המפורסמים ביותר בטוקיו. כשחברים אומרים "נתראה ליד האצ\'יקו", הם זוכרים כלב שלא הפסיק לחכות.' }
    ]},
  { id:'honey', level:3, real:true, title:'Honey Never Goes Bad', he:'דבש אף פעם לא מתקלקל', cover:'🍯', blurb:'עובדות מרתקות על המאכל היחיד שמחזיק אלפי שנים.',
    paras:[
      { en:'Here is a strange fact: honey never goes bad. Scientists have found pots of honey in very old tombs in Egypt. The honey was about three thousand years old, and people could still eat it!', he:'הנה עובדה מוזרה: דבש אף פעם לא מתקלקל. מדענים מצאו כדים של דבש בקברים עתיקים מאוד במצרים. הדבש היה בן כשלושת אלפים שנה, ועדיין אפשר היה לאכול אותו!' },
      { en:'How is this possible? Most food goes bad because tiny living things grow in it. They need water to live. But honey has very little water and a lot of sugar. Nothing can grow there. Honey is also a little sour, like lemon juice, and this helps too.', he:'איך זה אפשרי? רוב המזון מתקלקל כי יצורים חיים זעירים גדלים בו. הם צריכים מים כדי לחיות. אבל בדבש יש מעט מאוד מים והרבה סוכר. שום דבר לא יכול לגדול שם. דבש הוא גם קצת חמוץ, כמו מיץ לימון, וגם זה עוזר.' },
      { en:'Making honey is hard work. A bee flies from flower to flower and drinks a sweet liquid. She carries it home in a special second stomach. At home, other bees take the liquid and put it into small rooms made of wax. Then hundreds of bees move their wings very fast, like little fans. The wind from their wings dries the liquid, and it slowly becomes thick, golden honey.', he:'הכנת דבש היא עבודה קשה. דבורה עפה מפרח לפרח ושותה נוזל מתוק. היא נושאת אותו הביתה בקיבה שנייה ומיוחדת. בבית, דבורים אחרות לוקחות את הנוזל ושמות אותו בחדרים קטנים עשויים שעווה. אחר כך מאות דבורים מניעות את הכנפיים מהר מאוד, כמו מאווררים קטנים. הרוח מהכנפיים מייבשת את הנוזל, והוא הופך לאט לדבש סמיך וזהוב.' },
      { en:'The numbers are amazing. To make one small jar of honey, bees must visit about two million flowers. Together, they fly a distance that is longer than a trip around the world. And one bee, in her whole life, makes only a tiny drop of honey, less than a small spoon.', he:'המספרים מדהימים. כדי להכין צנצנת קטנה אחת של דבש, הדבורים צריכות לבקר בכשני מיליון פרחים. יחד הן עפות מרחק ארוך יותר מטיול מסביב לעולם. ודבורה אחת, בכל חייה, מכינה רק טיפה זעירה של דבש, פחות מכפית קטנה.' },
      { en:'So the next time you put honey in your tea, stop for a second. Think about the thousands of bees and the millions of flowers inside that spoon. And remember: if you close the jar well, your honey will stay good longer than you will!', he:'אז בפעם הבאה שתשימו דבש בתה, עצרו לשנייה. חשבו על אלפי הדבורים ועל מיליוני הפרחים שבתוך הכפית הזאת. וזכרו: אם תסגרו היטב את הצנצנת, הדבש שלכם יחזיק מעמד יותר זמן מכם!' }
    ]},
  { id:'popsicle', level:3, real:true, title:'The Boy Who Invented the Popsicle', he:'הילד שהמציא את הארטיק', cover:'🧊', blurb:'איך כוס שנשכחה בחוץ בלילה קר הפכה להמצאה.',
    paras:[
      { en:'Some great ideas start with a mistake. This one started with a boy who forgot his drink.', he:'יש רעיונות גדולים שמתחילים בטעות. הרעיון הזה התחיל בילד ששכח את המשקה שלו.' },
      { en:'In 1905, Frank Epperson was eleven years old. He lived in California, in the United States. One evening, he sat outside his house and made a sweet drink. He mixed water with a sugary powder and moved it around with a small wooden stick. Then something took his attention. Maybe his mother called him for dinner. Frank went inside and left the cup outside, with the stick still in it.', he:'בשנת 1905 פרנק אפרסון היה בן אחת עשרה. הוא גר בקליפורניה שבארצות הברית. ערב אחד הוא ישב מחוץ לבית והכין משקה מתוק. הוא ערבב מים עם אבקה מתוקה ובחש בעזרת מקל עץ קטן. ואז משהו משך את תשומת הלב שלו. אולי אמא שלו קראה לו לארוחת ערב. פרנק נכנס הביתה והשאיר את הכוס בחוץ, כשהמקל עדיין בתוכה.' },
      { en:'That night was unusually cold. In the morning, Frank found his cup. The drink was frozen like a stone! He pulled the stick, and the ice came out of the cup in one piece. He tasted it. It was cold, sweet, and delicious.', he:'אותו לילה היה קר במיוחד. בבוקר פרנק מצא את הכוס שלו. המשקה היה קפוא כמו אבן! הוא משך את המקל, והקרח יצא מהכוס בחתיכה אחת. הוא טעם אותו. זה היה קר, מתוק וטעים מאוד.' },
      { en:'Frank showed the frozen drink to his friends, and they loved it. For years, he made it at home, first for friends and later for his own children. In 1923, when he was a grown man, he decided to sell his ice on a stick to the public. He called it the "Epsicle," a mix of his family name and the word "icicle."', he:'פרנק הראה את המשקה הקפוא לחברים שלו, והם אהבו אותו. במשך שנים הוא הכין אותו בבית, קודם לחברים ואחר כך לילדים שלו. בשנת 1923, כשכבר היה איש מבוגר, הוא החליט למכור לציבור את הקרח שלו על מקל. הוא קרא לו "אפסיקל", שילוב של שם המשפחה שלו והמילה "icicle" (נטיף קרח).' },
      { en:'But his children had a different name for it. They called their father "Pop," so they always asked for a "Pop\'s sicle." The name stayed. Today, people eat about two billion Popsicles every year, all because one boy forgot his cup on a cold night.', he:'אבל לילדים שלו היה שם אחר בשבילו. הם קראו לאבא שלהם "פופ", אז הם תמיד ביקשו "פופס סיקל". השם נשאר. היום אנשים אוכלים כשני מיליארד ארטיקים כאלה בכל שנה, והכל בגלל ילד אחד ששכח את הכוס שלו בלילה קר.' }
    ]},
  /* ---------- stage 4: longer true stories ---------- */
  { id:'mile', level:4, real:true, title:'The Four-Minute Mile', he:'מייל בארבע דקות', cover:'🏃', blurb:'הריצה שכולם אמרו שהיא בלתי אפשרית, עד שמישהו עשה אותה.',
    paras:[
      { en:'For many years, people believed that no human could run one mile in less than four minutes. A mile is about 1,600 meters, a little more than four times around a running track. Runners came close, again and again, but nobody could break the four-minute wall. Some people even said that the human body was simply not built for such speed. They warned that the heart of a runner might not survive the effort.', he:'במשך שנים רבות אנשים האמינו שאף אדם לא יכול לרוץ מייל אחד בפחות מארבע דקות. מייל הוא בערך 1,600 מטר, קצת יותר מארבע הקפות במסלול ריצה. רצים התקרבו, שוב ושוב, אבל אף אחד לא הצליח לשבור את חומת ארבע הדקות. היו אפילו מי שאמרו שגוף האדם פשוט לא בנוי למהירות כזאת. הם הזהירו שלבו של רץ עלול לא לשרוד את המאמץ.' },
      { en:'Roger Bannister did not agree. He was a young Englishman who studied medicine at university, and running was only his hobby. He did not have much free time. Most days, he trained for less than an hour, during his lunch break, and then hurried back to the hospital. But Bannister had something special: he thought about running like a scientist. He studied his own body, measured his breathing, and planned every step of the race.', he:'רוג\'ר באניסטר לא הסכים. הוא היה אנגלי צעיר שלמד רפואה באוניברסיטה, והריצה הייתה רק התחביב שלו. לא היה לו הרבה זמן פנוי. ברוב הימים הוא התאמן פחות משעה, בהפסקת הצהריים, ואז מיהר בחזרה לבית החולים. אבל לבאניסטר היה משהו מיוחד: הוא חשב על ריצה כמו מדען. הוא חקר את הגוף שלו, מדד את הנשימה שלו ותכנן כל צעד במרוץ.' },
      { en:'In 1952, he ran in the Olympic Games in Helsinki. Everyone expected him to win a medal, but he finished in fourth place. He was deeply disappointed and almost stopped running. Instead, he chose a new goal, bigger than a medal. He decided to become the first person to run a mile in under four minutes.', he:'בשנת 1952 הוא רץ במשחקים האולימפיים בהלסינקי. כולם ציפו שיזכה במדליה, אבל הוא סיים במקום הרביעי. הוא היה מאוכזב מאוד וכמעט הפסיק לרוץ. במקום זה הוא בחר מטרה חדשה, גדולה ממדליה. הוא החליט להיות האדם הראשון שרץ מייל בפחות מארבע דקות.' },
      { en:'The big day came on May 6, 1954, in the city of Oxford. The weather was terrible. A strong, cold wind blew across the track, and Bannister nearly decided not to try. He had worked at the hospital that same morning. But a short time before the race, the wind became weaker. He looked at the flag above a nearby church, saw it moving more gently, and made his decision: today.', he:'היום הגדול הגיע ב-6 במאי 1954, בעיר אוקספורד. מזג האוויר היה נוראי. רוח חזקה וקרה נשבה על המסלול, ובאניסטר כמעט החליט לא לנסות. באותו בוקר הוא עוד עבד בבית החולים. אבל זמן קצר לפני המרוץ הרוח נחלשה. הוא הסתכל על הדגל שמעל כנסייה סמוכה, ראה שהוא מתנופף בעדינות רבה יותר, והחליט: היום.' },
      { en:'Two friends helped him. They ran in front of him for the first three laps to keep the speed high. With about 250 meters left, Bannister passed them and ran alone. His legs were burning, and his chest hurt. About three thousand people stood around the track and shouted. He crossed the finish line and fell into the arms of his friends, with almost no strength left.', he:'שני חברים עזרו לו. הם רצו לפניו בשלוש ההקפות הראשונות כדי לשמור על מהירות גבוהה. כשנשארו בערך 250 מטר, באניסטר עקף אותם ורץ לבד. הרגליים שלו בערו והחזה כאב. כשלושת אלפים איש עמדו סביב המסלול וצעקו. הוא חצה את קו הסיום ונפל לזרועות החברים שלו, כמעט בלי כוח.' },
      { en:'Then the announcer began to read the result. "The time was three..." The crowd started to scream, and nobody heard the rest. The full time was three minutes and 59.4 seconds. The impossible had been done.', he:'ואז הכרוז התחיל לקרוא את התוצאה. "הזמן היה שלוש..." הקהל התחיל לצרוח, ואף אחד לא שמע את ההמשך. הזמן המלא היה שלוש דקות ו-59.4 שניות. הבלתי אפשרי נעשה.' },
      { en:'The most interesting part of the story happened next. Only forty-six days later, another runner, John Landy from Australia, ran the mile even faster. In the following years, many more runners did it. Today, strong high school runners have done it too. The human body did not change in 1954. What changed was belief. Once people saw that it was possible, the wall in their minds fell down.', he:'החלק הכי מעניין בסיפור קרה אחר כך. רק ארבעים ושישה ימים מאוחר יותר, רץ אחר, ג\'ון לנדי מאוסטרליה, רץ את המייל אפילו מהר יותר. בשנים שלאחר מכן עשו זאת עוד רצים רבים. היום גם רצים חזקים בגיל תיכון עשו את זה. גוף האדם לא השתנה בשנת 1954. מה שהשתנה היה האמונה. ברגע שאנשים ראו שזה אפשרי, החומה שבראש שלהם נפלה.' },
      { en:'Bannister later became a respected doctor, and he always said that his work in medicine was more important to him than his famous race. But for the rest of us, his four minutes carry a simple message. Sometimes the biggest limit is not in our legs. It is in our heads.', he:'באניסטר הפך מאוחר יותר לרופא מוערך, ותמיד אמר שהעבודה שלו ברפואה חשובה לו יותר מהמרוץ המפורסם. אבל לכל השאר, ארבע הדקות שלו נושאות מסר פשוט. לפעמים הגבול הגדול ביותר אינו ברגליים שלנו. הוא בראש שלנו.' }
    ]},
  { id:'penicillin', level:4, real:true, title:'The Lucky Mistake That Saved Millions', he:'הטעות המוצלחת שהצילה מיליונים', cover:'🔬', blurb:'מעבדה מבולגנת, צלחת מלוכלכת, והתגלית ששינתה את הרפואה.',
    paras:[
      { en:'Alexander Fleming was a brilliant scientist, but he was not a tidy man. His laboratory in a London hospital was famous for its mess. Glass dishes, bottles, and papers covered every table. In the summer of 1928, this mess changed the history of medicine.', he:'אלכסנדר פלמינג היה מדען מבריק, אבל הוא לא היה אדם מסודר. המעבדה שלו בבית חולים בלונדון הייתה ידועה בבלגן שלה. צלחות זכוכית, בקבוקים וניירות כיסו כל שולחן. בקיץ 1928 הבלגן הזה שינה את ההיסטוריה של הרפואה.' },
      { en:'At that time, even a small cut could be dangerous. If bacteria entered the body, doctors had no good way to stop them. People died from a scratch in the garden, from a sore throat, or from a bad tooth. Hospitals were full of patients, and doctors could only wait and hope.', he:'באותם ימים, אפילו חתך קטן היה יכול להיות מסוכן. אם חיידקים נכנסו לגוף, לרופאים לא הייתה דרך טובה לעצור אותם. אנשים מתו משריטה בגינה, מכאב גרון או משן חולה. בתי החולים היו מלאים בחולים, והרופאים יכלו רק לחכות ולקוות.' },
      { en:'Fleming was studying these dangerous bacteria. He grew them in small, flat glass dishes. In August, he left for a family holiday. He was in a hurry, so he did not wash his dishes. He simply left them in a pile on the corner of a table.', he:'פלמינג חקר את החיידקים המסוכנים האלה. הוא גידל אותם בצלחות זכוכית קטנות ושטוחות. באוגוסט הוא יצא לחופשה משפחתית. הוא מיהר, אז לא שטף את הצלחות. הוא פשוט השאיר אותן בערימה בפינת השולחן.' },
      { en:'When he returned in September, he started to clean up. Then he noticed something strange in one of the dishes. A spot of blue-green mold was growing in it, the same kind of mold that grows on old bread. That was not surprising in such a messy room. But around the mold, there was a clear circle. All the bacteria near it were dead.', he:'כשחזר בספטמבר, הוא התחיל לסדר. ואז הבחין במשהו מוזר באחת הצלחות. כתם של עובש כחול-ירוק צמח בה, אותו סוג של עובש שצומח על לחם ישן. זה לא היה מפתיע בחדר מבולגן כל כך. אבל מסביב לעובש היה עיגול נקי. כל החיידקים שלידו היו מתים.' },
      { en:'Many people would have thrown the dish away. Fleming looked closer. "That\'s funny," he said. He understood that the mold was making something that killed bacteria. He grew more of the mold and tested it carefully. It destroyed many kinds of dangerous bacteria, but it did not hurt the human body. He named the new material penicillin.', he:'אנשים רבים היו זורקים את הצלחת. פלמינג הסתכל מקרוב. "זה מצחיק," אמר. הוא הבין שהעובש מייצר משהו שהורג חיידקים. הוא גידל עוד מהעובש ובדק אותו בזהירות. הוא השמיד סוגים רבים של חיידקים מסוכנים, אבל לא פגע בגוף האדם. הוא קרא לחומר החדש פניצילין.' },
      { en:'However, the story did not end there. Fleming could not produce enough penicillin to treat even one patient. It was too difficult to get it out of the mold. He wrote about his discovery in 1929, but almost nobody paid attention. For ten years, the idea waited quietly.', he:'אבל הסיפור לא נגמר שם. פלמינג לא הצליח לייצר מספיק פניצילין כדי לטפל אפילו בחולה אחד. היה קשה מדי להפיק אותו מהעובש. הוא כתב על התגלית שלו בשנת 1929, אבל כמעט אף אחד לא שם לב. במשך עשר שנים הרעיון חיכה בשקט.' },
      { en:'Then, at the start of the Second World War, a team of scientists at Oxford University read the old paper by Fleming. They found a way to produce penicillin in large amounts. By the end of the war, factories were making enough to treat hundreds of thousands of wounded soldiers. Infections that once killed people in days now disappeared with a few doses of medicine.', he:'ואז, בתחילת מלחמת העולם השנייה, צוות מדענים מאוניברסיטת אוקספורד קרא את המאמר הישן של פלמינג. הם מצאו דרך לייצר פניצילין בכמויות גדולות. עד סוף המלחמה, מפעלים ייצרו מספיק כדי לטפל במאות אלפי חיילים פצועים. זיהומים שפעם הרגו אנשים בתוך ימים נעלמו עכשיו אחרי כמה מנות של תרופה.' },
      { en:'In 1945, Fleming and two scientists from the Oxford team received the Nobel Prize. Since then, penicillin and the medicines that followed it have saved hundreds of millions of lives. Fleming always stayed modest about it. "I did not invent penicillin," he liked to say. "Nature did that. I only discovered it by accident."', he:'בשנת 1945 קיבלו פלמינג ושני מדענים מהצוות של אוקספורד את פרס נובל. מאז, הפניצילין והתרופות שבאו אחריו הצילו מאות מיליוני חיים. פלמינג תמיד נשאר צנוע בעניין. "אני לא המצאתי את הפניצילין," הוא אהב לומר. "הטבע עשה את זה. אני רק גיליתי אותו במקרה."' },
      { en:'Was it only luck? Not exactly. The mold arrived by chance, but luck was not enough. Somebody had to notice the strange dish, stop, and ask why. The real gift of Fleming was his curiosity. He looked at a dirty dish and saw a question worth asking.', he:'האם זה היה רק מזל? לא בדיוק. העובש הגיע במקרה, אבל מזל לא הספיק. מישהו היה צריך לשים לב לצלחת המוזרה, לעצור ולשאול למה. הכישרון האמיתי של פלמינג היה הסקרנות שלו. הוא הסתכל על צלחת מלוכלכת וראה שאלה ששווה לשאול.' }
    ]},
  { id:'windmill', level:4, real:true, title:'The Boy Who Caught the Wind', he:'הנער שתפס את הרוח', cover:'🌬️', blurb:'נער בן 14 ממלאווי בונה טחנת רוח מגרוטאות ומספר ספרייה.',
    paras:[
      { en:'William Kamkwamba grew up in a small village in Malawi, a country in the south-east of Africa. His family were farmers. They grew corn on a small piece of land, and like most of their neighbors, they had no electricity and no running water. When the sun went down, the village went dark.', he:'ויליאם קמקוומבה גדל בכפר קטן במלאווי, מדינה בדרום-מזרח אפריקה. המשפחה שלו הייתה משפחת חקלאים. הם גידלו תירס על חלקת אדמה קטנה, וכמו רוב השכנים שלהם, לא היו להם חשמל ומים זורמים. כשהשמש שקעה, הכפר החשיך.' },
      { en:'In 2001, when William was fourteen, the rains did not come. The corn dried in the fields, and a terrible hunger began. Many families, including his own, ate only one small meal a day. There was no money left for school. After only a few months in high school, William had to leave, because his parents could not pay.', he:'בשנת 2001, כשויליאם היה בן ארבע עשרה, הגשמים לא הגיעו. התירס התייבש בשדות, והתחיל רעב נורא. משפחות רבות, כולל המשפחה שלו, אכלו רק ארוחה קטנה אחת ביום. לא נשאר כסף לבית הספר. אחרי כמה חודשים בלבד בתיכון, ויליאם נאלץ לעזוב, כי ההורים שלו לא יכלו לשלם.' },
      { en:'William refused to stop learning. Near his old primary school there was a tiny library with a few shelves of books sent from other countries. He started to go there every day. His English was still weak, so he studied the pictures and drawings and slowly worked out the meaning of the words around them.', he:'ויליאם סירב להפסיק ללמוד. ליד בית הספר היסודי הישן שלו הייתה ספרייה קטנטנה עם כמה מדפים של ספרים שנשלחו ממדינות אחרות. הוא התחיל ללכת לשם כל יום. האנגלית שלו עדיין הייתה חלשה, אז הוא למד מהתמונות ומהציורים ולאט לאט פענח את משמעות המילים שסביבם.' },
      { en:'One day he found a book about energy. On the cover was a picture of tall white windmills. The book explained that a windmill can make electricity and pump water. William thought about his village. With electricity, his family could have light at night. With a water pump, they could grow food even when the rain did not fall. He decided to build a windmill himself.', he:'יום אחד הוא מצא ספר על אנרגיה. על הכריכה הייתה תמונה של טחנות רוח לבנות וגבוהות. הספר הסביר שטחנת רוח יכולה לייצר חשמל ולשאוב מים. ויליאם חשב על הכפר שלו. עם חשמל, למשפחה שלו יהיה אור בלילה. עם משאבת מים, הם יוכלו לגדל אוכל גם כשהגשם לא יורד. הוא החליט לבנות טחנת רוח בעצמו.' },
      { en:'He had no money for parts, so he went to the place where people threw away old machines. There he collected what he could: a fan from a broken tractor, plastic pipes, a bicycle wheel, and an old bicycle lamp. For the tower, he cut down tall, thin trees. People in the village laughed at him. They thought the hungry boy had gone crazy. Even his mother was worried.', he:'לא היה לו כסף לחלקים, אז הוא הלך למקום שבו אנשים זרקו מכונות ישנות. שם הוא אסף מה שיכול: מאוורר מטרקטור שבור, צינורות פלסטיק, גלגל של אופניים ופנס אופניים ישן. בשביל המגדל הוא כרת עצים גבוהים ודקים. אנשי הכפר צחקו עליו. הם חשבו שהנער הרעב השתגע. אפילו אמא שלו דאגה.' },
      { en:'William kept working. After a few months, his tower stood five meters high behind the family house. He climbed up and connected the last wires. A crowd of neighbors came to watch, and some came just to laugh. The wind began to blow. The blades started to turn, slowly and then faster. In his hand, a small light bulb started to shine. The crowd went silent, and then everybody cheered.', he:'ויליאם המשיך לעבוד. אחרי כמה חודשים, המגדל שלו עמד בגובה חמישה מטרים מאחורי בית המשפחה. הוא טיפס למעלה וחיבר את החוטים האחרונים. קהל של שכנים בא לצפות, וחלק באו רק כדי לצחוק. הרוח התחילה לנשוב. הלהבים התחילו להסתובב, לאט ואז מהר יותר. ביד שלו, נורה קטנה התחילה להאיר. הקהל השתתק, ואז כולם הריעו.' },
      { en:'Soon the windmill gave light to four lamps in his home, and neighbors stood in line to charge their mobile phones. Later, William built a second, bigger windmill that helped bring water to the family garden.', he:'עד מהרה טחנת הרוח סיפקה אור לארבע מנורות בבית שלו, ושכנים עמדו בתור כדי להטעין את הטלפונים הניידים שלהם. מאוחר יותר ויליאם בנה טחנת רוח שנייה, גדולה יותר, שעזרה להביא מים לגינה של המשפחה.' },
      { en:'News of the boy and his windmill travelled far. Reporters wrote about him, and he was invited to speak in front of scientists and inventors from all over the world. He was nervous, and his English was simple, but one sentence touched everyone in the room: "I tried, and I made it." People helped him go back to school. Years later, he finished his studies at a famous college in the United States.', he:'החדשות על הנער וטחנת הרוח שלו הגיעו רחוק. כתבים כתבו עליו, והוא הוזמן לדבר בפני מדענים וממציאים מכל העולם. הוא היה לחוץ, והאנגלית שלו הייתה פשוטה, אבל משפט אחד נגע בכל מי שהיה בחדר: "ניסיתי, והצלחתי." אנשים עזרו לו לחזור לבית הספר. שנים אחר כך הוא סיים את לימודיו במכללה מפורסמת בארצות הברית.' },
      { en:'Today, William works on projects that bring clean water, energy, and education to villages like his own. His story reminds us that a library card, some old junk, and a curious mind can be enough to change a life.', he:'היום ויליאם עובד על פרויקטים שמביאים מים נקיים, אנרגיה וחינוך לכפרים כמו הכפר שלו. הסיפור שלו מזכיר לנו שכרטיס ספרייה, קצת גרוטאות ישנות וראש סקרן יכולים להספיק כדי לשנות חיים.' }
    ]}
